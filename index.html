<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的聲量表 - 互動視覺提示咭</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts 圓體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at top left, #f0f9ff, #e0f2fe 40%, #f8fafc);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    /* 喇叭搖晃發聲微動效 */
    @keyframes speakerPulse {
      0% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.2) rotate(-12deg); }
      30% { transform: scale(1.2) rotate(12deg); }
      45% { transform: scale(1.2) rotate(-8deg); }
      60% { transform: scale(1.1) rotate(6deg); }
      75% { transform: scale(1.05) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .speaker-wave-anim {
      display: inline-block;
      animation: speakerPulse 1.8s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* 柔和立體卡片陰影 */
    .soft-card-shadow {
      box-shadow: 0 12px 30px -10px rgba(14, 165, 233, 0.15), 0 4px 12px -4px rgba(0, 0, 0, 0.05);
    }

    /* 直角三角形音量指示槽 */
    .triangle-container {
      position: relative;
      width: 100%;
      height: 44px;
      cursor: pointer;
    }

    .triangle-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #e2e8f0;
      clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
      border-radius: 0 0 8px 0;
    }

    .triangle-fill-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .triangle-fill {
      width: 100%;
      height: 100%;
      background: var(--theme-color, #64748b);
      clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
      transition: background-color 0.25s ease;
    }

    /* 自訂獨立圓形滑塊 */
    .custom-slider-thumb {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      border: 3.5px solid var(--theme-color, #0284c7);
      pointer-events: none;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease;
      z-index: 15;
    }

    .volume-range-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      z-index: 20;
      opacity: 0;
    }

    /* 雲朵形狀提示泡泡 */
    .cloud-bubble-tip {
      position: relative;
      background: #ffffff;
      border: 2.5px solid var(--theme-color, #38bdf8);
      border-radius: 18px;
      transition: all 0.3s ease;
    }
    .cloud-bubble-tip::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 24px;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-bottom: 2.5px solid var(--theme-color, #38bdf8);
      border-right: 2.5px solid var(--theme-color, #38bdf8);
      transform: rotate(45deg);
    }

    .card-img-enter {
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0.2; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 手機橫向環境高度最佳化（高度極矮時自動適配） */
    @media (orientation: landscape) and (max-height: 520px) {
      body {
        padding: 4px 8px;
      }
      .main-card {
        padding: 8px 14px !important;
      }
      .hero-img-box {
        width: 120px !important;
        height: 120px !important;
      }
      .top-header {
        margin-bottom: 4px !important;
      }
      .panel-content {
        margin-bottom: 4px !important;
      }
      .triangle-container {
        height: 34px !important;
      }
      .custom-slider-thumb {
        width: 30px !important;
        height: 30px !important;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部標題列 -->
  <header class="top-header w-full max-w-4xl text-center mb-2 shrink-0">
    <div class="inline-flex items-center gap-2 bg-white/95 backdrop-blur px-4 py-1 rounded-full border border-sky-200 shadow-sm">
      <span class="text-xl speaker-wave-anim">📢</span>
      <h1 class="text-lg md:text-xl font-black tracking-wide text-sky-950">我的聲量表</h1>
      <span class="text-xs px-2 py-0.5 bg-sky-100 text-sky-800 rounded-full font-bold">視覺提示咭</span>
    </div>
  </header>

  <!-- 主互動舞台卡片 -->
  <main class="main-card w-full max-w-4xl bg-white/95 backdrop-blur rounded-2xl md:rounded-3xl p-3 md:p-6 soft-card-shadow border border-white flex flex-col justify-between">
    
    <!-- 上半部：圖片展示與說明文字 -->
    <div class="panel-content w-full flex flex-row items-center justify-center gap-3 md:gap-8 mb-3">
      
      <!-- 圖片容器 -->
      <div id="imgCardBox" class="hero-img-box relative w-36 h-36 sm:w-48 sm:h-48 md:w-56 md:h-56 bg-slate-50 border-4 rounded-2xl md:rounded-3xl flex items-center justify-center p-2 transition-all duration-300 overflow-hidden shadow-inner shrink-0">
        <img 
          id="soundImage" 
          src="0.png" 
          alt="聲量圖示" 
          class="w-full h-full object-contain card-img-enter"
          onerror="handleImgError(this)"
        >

        <!-- 左上角音量數字徽章 -->
        <div id="levelBadge" class="absolute top-2 left-2 w-9 h-9 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center text-white text-xl sm:text-2xl font-black shadow-md transition-all duration-300">
          0
        </div>
      </div>

      <!-- 右側文字解說與情境泡泡框 -->
      <div class="flex-1 w-full max-w-md flex flex-col justify-center">
        
        <!-- 雲朵提示框 -->
        <div class="cloud-bubble-tip p-2.5 sm:p-4 shadow-sm mb-2 sm:mb-3">
          <div class="flex items-center gap-1.5 text-xs font-bold tracking-wider uppercase text-slate-400">
            <i class="fa-solid fa-volume-high" id="speakerIcon"></i>
            <span>聲量級別說明</span>
          </div>
          <div id="levelTitle" class="text-xl sm:text-3xl font-black tracking-tight text-slate-900 transition-colors">
            保持安靜
          </div>
          <p id="levelDesc" class="text-slate-600 text-xs sm:text-base mt-0.5 font-medium leading-snug">
            閉住嘴巴，不發出任何聲音。
          </p>
        </div>

        <!-- 建議使用場景 -->
        <div class="bg-slate-50/80 border border-slate-200/80 rounded-xl p-2 sm:p-2.5 flex items-center gap-2 sm:gap-3">
          <div id="contextIconBox" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-slate-200 text-slate-600 flex items-center justify-center text-lg shrink-0 transition-colors">
            <i id="contextIcon" class="fa-solid fa-book-open"></i>
          </div>
          <div class="overflow-hidden">
            <div class="text-[10px] text-slate-400 font-bold uppercase leading-none mb-0.5">適合使用的場景</div>
            <div id="contextText" class="text-slate-800 font-bold text-xs sm:text-base truncate sm:whitespace-normal">閱讀圖書、書寫、聆聽別人說話時</div>
          </div>
        </div>

      </div>
    </div>

    <!-- 下半部：三角形滑桿及快速點選按鈕面板 -->
    <div class="w-full bg-slate-50/90 rounded-xl sm:rounded-2xl p-2 sm:p-3 border border-slate-200">
      
      <!-- 控制列頂部 -->
      <div class="flex items-center justify-between mb-1 sm:mb-2">
        <span class="text-xs sm:text-sm font-bold text-slate-600 flex items-center gap-1">
          <i class="fa-solid fa-hand-pointer text-sky-500"></i> 請滑動三角形條或點選數字：
        </span>
        <!-- 音效切換 -->
        <button id="soundToggleBtn" class="text-[11px] sm:text-xs bg-white hover:bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full border border-slate-300 font-bold transition flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-bell text-sky-500"></i> 音效開
        </button>
      </div>

      <!-- 直角三角形音量滑桿容器 -->
      <div class="px-1 mb-2">
        <div class="triangle-container" id="triangleContainer">
          <!-- 灰色底座直角三角形 -->
          <div class="triangle-bg"></div>

          <!-- 彩色填充層 -->
          <div id="triangleFillWrapper" class="triangle-fill-wrapper">
            <div id="triangleFill" class="triangle-fill"></div>
          </div>

          <!-- 精確對齊色塊邊界的圓形滑塊 -->
          <div id="customThumb" class="custom-slider-thumb"></div>

          <!-- 透明滑動互動層 -->
          <input 
            type="range" 
            id="volumeRange" 
            min="0" 
            max="5" 
            step="1" 
            value="0" 
            class="volume-range-overlay"
          >
        </div>

        <!-- 輔助說明標籤 -->
        <div class="flex justify-between items-center text-[10px] sm:text-xs font-bold text-slate-400 mt-0.5 px-1">
          <span>🔇 保持安靜 (0)</span>
          <span>呼救最響亮 (5) 📢</span>
        </div>
      </div>

      <!-- 快速點選按鈕矩陣 (0 ~ 5) -->
      <div class="grid grid-cols-6 gap-1 sm:gap-2">
        <button onclick="changeLevel(0)" class="level-btn py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-center border-2 transition-all duration-200 flex flex-col items-center shadow-sm" data-level="0">
          <span class="text-base sm:text-xl font-black leading-none">0</span>
          <span class="text-[10px] sm:text-xs font-bold truncate max-w-full mt-0.5">保持安靜</span>
        </button>
        <button onclick="changeLevel(1)" class="level-btn py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-center border-2 transition-all duration-200 flex flex-col items-center shadow-sm" data-level="1">
          <span class="text-base sm:text-xl font-black leading-none">1</span>
          <span class="text-[10px] sm:text-xs font-bold truncate max-w-full mt-0.5">說秘密</span>
        </button>
        <button onclick="changeLevel(2)" class="level-btn py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-center border-2 transition-all duration-200 flex flex-col items-center shadow-sm" data-level="2">
          <span class="text-base sm:text-xl font-black leading-none">2</span>
          <span class="text-[10px] sm:text-xs font-bold truncate max-w-full mt-0.5">身旁的人</span>
        </button>
        <button onclick="changeLevel(3)" class="level-btn py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-center border-2 transition-all duration-200 flex flex-col items-center shadow-sm" data-level="3">
          <span class="text-base sm:text-xl font-black leading-none">3</span>
          <span class="text-[10px] sm:text-xs font-bold truncate max-w-full mt-0.5">室內較遠</span>
        </button>
        <button onclick="changeLevel(4)" class="level-btn py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-center border-2 transition-all duration-200 flex flex-col items-center shadow-sm" data-level="4">
          <span class="text-base sm:text-xl font-black leading-none">4</span>
          <span class="text-[10px] sm:text-xs font-bold truncate max-w-full mt-0.5">室外玩耍</span>
        </button>
        <button onclick="changeLevel(5)" class="level-btn py-1 sm:py-1.5 rounded-lg sm:rounded-xl text-center border-2 transition-all duration-200 flex flex-col items-center shadow-sm" data-level="5">
          <span class="text-base sm:text-xl font-black leading-none">5</span>
          <span class="text-[10px] sm:text-xs font-bold truncate max-w-full mt-0.5">求救</span>
        </button>
      </div>

    </div>

  </main>

  <script>
    const levels = [
      {
        level: 0,
        img: "0.png",
        title: "保持安靜",
        desc: "閉住嘴巴，不發出任何聲音。",
        context: "閱讀圖書、書寫、聆聽別人說話時",
        icon: "fa-solid fa-book-open",
        themeColor: "#64748b",
        lightBg: "#f8fafc",
        border: "#cbd5e1",
        freq: 261.63
      },
      {
        level: 1,
        img: "1.png",
        title: "說秘密",
        desc: "輕聲說話，只有身旁的人靠近才能聽見。",
        context: "跟身旁的人說悄悄話、私下互相提醒",
        icon: "fa-solid fa-ear-listen",
        themeColor: "#0284c7",
        lightBg: "#f0f9ff",
        border: "#7dd3fc",
        freq: 293.66
      },
      {
        level: 2,
        img: "2.png",
        title: "和附近人說話",
        desc: "平常溫和對話的音量，坐在附近的同學清楚聽到即可。",
        context: "討論題目、分組活動合作",
        icon: "fa-solid fa-user-group",
        themeColor: "#16a34a",
        lightBg: "#f0fdf4",
        border: "#86efac",
        freq: 329.63
      },
      {
        level: 3,
        img: "3.png",
        title: "室內較遠距離",
        desc: "清脆響亮的大聲發言，讓整間課室的同學都聽得到。",
        context: "向全班發言",
        icon: "fa-solid fa-chalkboard-user",
        themeColor: "#d97706",
        lightBg: "#fffbeb",
        border: "#fde68a",
        freq: 392.00
      },
      {
        level: 4,
        img: "4.png",
        title: "室外玩耍",
        desc: "在戶外操場遊樂場盡情跑跳玩耍，聲音可以響亮開朗！",
        context: "戶外遊樂場或操場遊玩時",
        icon: "fa-solid fa-tree",
        themeColor: "#ea580c",
        lightBg: "#fff7ed",
        border: "#fdba74",
        freq: 440.00
      },
      {
        level: 5,
        img: "5.png",
        title: "求救",
        desc: "遇到危險、意外或受傷時，用盡全力大聲呼叫「救命啊！」",
        context: "緊急意外、遇險求助、保護生命",
        icon: "fa-solid fa-triangle-exclamation",
        themeColor: "#dc2626",
        lightBg: "#fef2f2",
        border: "#fca5a5",
        freq: 523.25
      }
    ];

    let currentLevel = 0;
    let isSoundOn = true;
    let audioCtx = null;

    // 音效播放
    function playBeep(frequency) {
      if (!isSoundOn) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = currentLevel >= 4 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (err) {}
    }

    // 圖片載入失敗備援處理
    function handleImgError(imageEl) {
      imageEl.alt = `[請放入圖片 0.png ~ 5.png]`;
      imageEl.classList.remove('object-contain');
    }

    // 切換聲量等級
    function changeLevel(lvl) {
      currentLevel = lvl;
      const data = levels[lvl];

      document.documentElement.style.setProperty('--theme-color', data.themeColor);

      const img = document.getElementById('soundImage');
      img.classList.remove('card-img-enter');
      void img.offsetWidth;
      img.src = data.img;
      img.classList.add('card-img-enter');

      const imgCardBox = document.getElementById('imgCardBox');
      imgCardBox.style.borderColor = data.border;
      imgCardBox.style.backgroundColor = data.lightBg;

      const levelBadge = document.getElementById('levelBadge');
      levelBadge.textContent = data.level;
      levelBadge.style.backgroundColor = data.themeColor;

      const levelTitle = document.getElementById('levelTitle');
      levelTitle.textContent = data.title;
      levelTitle.style.color = data.themeColor;
      document.getElementById('levelDesc').textContent = data.desc;
      document.getElementById('contextText').textContent = data.context;

      const contextIcon = document.getElementById('contextIcon');
      contextIcon.className = data.icon;
      const contextIconBox = document.getElementById('contextIconBox');
      contextIconBox.style.backgroundColor = data.lightBg;
      contextIconBox.style.color = data.themeColor;

      // 1 號設定為右移 5%（即 25%）
      const fillPercentageMap = [0, 25, 40, 60, 80, 100];
      const percent = fillPercentageMap[lvl];
      const rightInset = 100 - percent;

      const slider = document.getElementById('volumeRange');
      slider.value = lvl;
      
      const fillWrapper = document.getElementById('triangleFillWrapper');
      fillWrapper.style.clipPath = `inset(0 ${rightInset}% 0 0)`;

      const triangleFill = document.getElementById('triangleFill');
      triangleFill.style.backgroundColor = data.themeColor;

      // 自訂圓形滑塊精準對齊色塊裁剪右邊界
      const customThumb = document.getElementById('customThumb');
      const thumbWidth = customThumb.offsetWidth || 34;
      const thumbHalfWidth = thumbWidth / 2;

      if (lvl === 0) {
        customThumb.style.left = '0px';
      } else if (lvl === 5) {
        customThumb.style.left = `calc(100% - ${thumbWidth}px)`;
      } else {
        customThumb.style.left = `calc(${percent}% - ${thumbHalfWidth}px)`;
      }

      document.querySelectorAll('.level-btn').forEach(btn => {
        const btnLvl = parseInt(btn.getAttribute('data-level'));
        if (btnLvl === lvl) {
          btn.style.backgroundColor = data.themeColor;
          btn.style.borderColor = data.themeColor;
          btn.style.color = '#ffffff';
          btn.style.transform = 'scale(1.05)';
        } else {
          btn.style.backgroundColor = '#ffffff';
          btn.style.borderColor = '#e2e8f0';
          btn.style.color = '#475569';
          btn.style.transform = 'scale(1)';
        }
      });

      playBeep(data.freq);
    }

    // 監聽滑桿變動
    const slider = document.getElementById('volumeRange');
    slider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      if (val !== currentLevel) {
        changeLevel(val);
      }
    });

    // 監聽音效開關
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    soundToggleBtn.addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      if (isSoundOn) {
        soundToggleBtn.innerHTML = '<i class="fa-solid fa-bell text-sky-500"></i> 音效開';
        soundToggleBtn.classList.remove('opacity-60');
      } else {
        soundToggleBtn.innerHTML = '<i class="fa-solid fa-bell-slash text-slate-400"></i> 已靜音';
        soundToggleBtn.classList.add('opacity-60');
      }
    });

    // 支援鍵盤方向鍵
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        if (currentLevel < 5) changeLevel(currentLevel + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        if (currentLevel > 0) changeLevel(currentLevel - 1);
      }
    });

    // 視窗尺寸改變或轉向時自動重新校正圓形定位
    window.addEventListener('resize', () => {
      changeLevel(currentLevel);
    });

    // 頁面載入初始化
    changeLevel(0);
  </script>
</body>
</html>
