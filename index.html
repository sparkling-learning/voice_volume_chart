<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的聲量表 - 互動視覺提示咭</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts 圓體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --app-height: 100vh;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at top left, #f0f9ff, #e0f2fe 40%, #f8fafc);
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    /* 喇叭搖晃發聲動畫 */
    @keyframes speakerPulse {
      0% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.2) rotate(-12deg); }
      30% { transform: scale(1.2) rotate(12deg); }
      45% { transform: scale(1.2) rotate(-8deg); }
      60% { transform: scale(1.1) rotate(6deg); }
      75% { transform: scale(1.05) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .speaker-wave-anim {
      display: inline-block;
      animation: speakerPulse 1.8s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* 裝置旋轉提示動畫 */
    @keyframes rotateDevice {
      0%, 20% { transform: rotate(0deg); }
      50%, 80% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    .rotate-device-anim {
      animation: rotateDevice 2.2s infinite ease-in-out;
    }

    /* 柔和立體卡片陰影 */
    .soft-card-shadow {
      box-shadow: 0 12px 30px -10px rgba(14, 165, 233, 0.12), 0 4px 12px -4px rgba(0, 0, 0, 0.05);
    }

    /* === 直角三角形音量指示槽 === */
    .triangle-container {
      position: relative;
      width: 100%;
      height: 38px;
      cursor: pointer;
    }
    @media (min-height: 600px) {
      .triangle-container {
        height: 48px;
      }
    }

    /* 底層淺灰直角三角形 */
    .triangle-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #e2e8f0;
      clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
      border-radius: 0 0 8px 0;
    }

    /* 外層裁剪容器 */
    .triangle-fill-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    /* 實體彩色三角形 */
    .triangle-fill {
      width: 100%;
      height: 100%;
      background: var(--theme-color, #64748b);
      clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
      transition: background-color 0.25s ease;
    }

    /* 自訂獨立圓形滑塊 */
    .custom-slider-thumb {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
      border: 3.5px solid var(--theme-color, #0284c7);
      pointer-events: none;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease;
      z-index: 15;
    }
    @media (min-height: 600px) {
      .custom-slider-thumb {
        width: 42px;
        height: 42px;
        border-width: 4px;
      }
    }

    /* 透明滑動互動層 */
    .volume-range-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      z-index: 20;
      opacity: 0;
    }
